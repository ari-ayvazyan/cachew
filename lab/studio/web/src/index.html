<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0f16">
  <title>Cachew Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bea'/%3E%3Cpath d='M9 11h14M9 16h9M9 21h5' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='21' r='3' fill='%2386efac'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#/" aria-label="Cachew Studio home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9 11h14M9 16h9M9 21h5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="22" cy="21" r="3" fill="#86efac"/></svg>
        </span>
        <span class="brand-text"><b>Cachew Studio</b><small>AI research lab on Omnigent</small></span>
      </a>
      <nav class="topbar-actions" aria-label="Main">
        <a href="#/" class="btn ghost sm hide-sm" id="nav-runs">Runs</a>
        <a id="omnigent-link" class="btn ghost sm hide-sm" target="_blank" rel="noopener">Omnigent <span aria-hidden="true">↗</span></a>
        <a href="#/new" class="btn primary sm" id="nav-new">New research</a>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div id="boot" class="container page-pad"><div class="skeleton-block"></div></div>
    <section id="page-home" class="page" hidden></section>
    <section id="page-new" class="page" hidden></section>
    <section id="page-run" class="page" hidden>
      <div class="container page-pad">
        <div id="run-head"></div>
        <div id="run-alert"></div>
        <div id="run-savings"></div>
        <div id="run-loop" class="card loop-card"></div>
        <nav class="tabs" id="run-tabs" role="tablist" aria-label="Run sections"></nav>
        <div id="tab-overview" class="tab-panel" role="tabpanel"></div>
        <div id="tab-team" class="tab-panel" role="tabpanel" hidden></div>
        <div id="tab-hypotheses" class="tab-panel" role="tabpanel" hidden></div>
        <div id="tab-experiment" class="tab-panel" role="tabpanel" hidden></div>
        <div id="tab-review" class="tab-panel" role="tabpanel" hidden></div>
        <div id="tab-acceleration" class="tab-panel" role="tabpanel" hidden></div>
        <div id="tab-record" class="tab-panel" role="tabpanel" hidden></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>Cachew Studio · every agent is an Omnigent session · every artifact is kept in the run's research record</span>
    </div>
  </footer>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-scrim" data-close></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer-head">
        <div class="drawer-titles">
          <p id="drawer-kicker" class="eyebrow"></p>
          <h2 id="drawer-title"></h2>
        </div>
        <button class="icon-btn" type="button" data-close aria-label="Close panel">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>
  </div>

  <dialog id="confirm" class="confirm">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button value="cancel" class="btn ghost">Cancel</button>
        <button value="ok" class="btn danger" id="confirm-ok">Confirm</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/assets/main.js"></script>
</body>
</html>
